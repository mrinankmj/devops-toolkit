# Nightly pg_dump to a PVC, keeping the last 7 backups.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:16-alpine
              env:
                - name: PGHOST
                  value: postgres
                - name: PGUSER
                  valueFrom: { secretKeyRef: { name: postgres-creds, key: username } }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: postgres-creds, key: password } }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  FILE=/backups/db-$(date +%Y%m%d-%H%M).sql.gz
                  pg_dumpall | gzip > "$FILE"
                  echo "Backup written: $FILE"
                  ls -1t /backups/*.sql.gz | tail -n +8 | xargs -r rm --
              resources:
                requests: { cpu: 50m, memory: 128Mi }
              volumeMounts:
                - { name: backups, mountPath: /backups }
          volumes:
            - name: backups
              persistentVolumeClaim: { claimName: postgres-backups }
